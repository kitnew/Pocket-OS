[package]
name = "pocket-desktop-agent"
description = "Pocket Desktop Agent: runs on the computer, executes registered desktop actions for a paired Pocket OS phone"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
pocket-dock-protocol = { path = "../pocket-dock-protocol" }
pocket-platform = { path = "../pocket-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tokio = { version = "1.54", features = ["rt", "macros", "signal", "time", "net", "sync", "io-util", "process"] }
futures-util = { version = "0.3", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
zbus = { version = "6.5", default-features = false, features = ["tokio", "proxy"] }

[dev-dependencies]
zbus = { version = "6.5", default-features = false, features = ["tokio", "proxy", "service"] }

[lints]
workspace = true
