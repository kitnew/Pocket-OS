[package]
name = "pocket-dock-protocol"
description = "Pocket Dock wire protocol: messages, Noise-encrypted framing and key files, shared by pocketd and the desktop agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = { version = "0.10", default-features = false, features = ["default-resolver", "use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom"] }
tokio = { version = "1.54", features = ["net", "io-util", "time", "sync", "rt"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["macros", "rt"] }

[lints]
workspace = true
