[package]
name = "pocketd"
description = "Pocket OS core daemon: serves pocket-core on the D-Bus session bus"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
pocket-core = { path = "../pocket-core" }
pocket-ipc = { path = "../pocket-ipc" }
pocket-platform = { path = "../pocket-platform" }
pocket-dock-protocol = { path = "../pocket-dock-protocol" }
serde_json = "1"
# rtnetlink socket for network-change hints (dock/netwatch.rs). Already used by zbus;
# pure Rust (linux_raw backend), no C toolchain needed for aarch64-musl.
rustix = { version = "1", default-features = false, features = ["std", "net"] }
inotify = { version = "0.11", default-features = false, features = ["stream"] }
tokio = { version = "1.54", features = ["rt", "macros", "signal", "time", "process", "net", "sync"] }
futures-util = { version = "0.3", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
zbus = { version = "6.5", default-features = false, features = ["tokio", "proxy", "service", "tracing"] }


[dev-dependencies]
pocket-desktop-agent = { path = "../pocket-desktop-agent" }
tokio = { version = "1.54", features = ["rt-multi-thread"] }

[lints]
workspace = true
