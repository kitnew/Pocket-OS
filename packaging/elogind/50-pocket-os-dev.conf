# Installed by Pocket OS (scripts/device-setup.sh) to /etc/elogind/logind.conf.d/.
# Policy: logind does nothing on a power-key press; the Pocket shell grabs the key
# through Phoc (phosh_private) and turns the display off/on (Stage 2). If the shell is
# not running, a short press does nothing, so it can never power the phone off by accident.
#
# postmarketOS ships the same setting in /usr/lib/elogind/logind.conf, but elogind 255
# only reads /etc/elogind/logind.conf and logind.conf.d drop-ins, so it had no effect
# (Stage 0 incident). Long press stays at the elogind default; the PMIC hard reset
# (hold ~10 s) is hardware and unaffected.
# Remove this file and `kill -HUP $(pidof elogind-daemon)` to restore the default.
[Login]
HandlePowerKey=ignore
