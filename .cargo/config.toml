# Cross-compilation for the device (postmarketOS/Alpine aarch64, musl).
# Pure-Rust crates only, so Rust's bundled lld and self-contained musl CRT are enough:
# no aarch64 C toolchain is needed on the host. Result: a static binary.
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]
