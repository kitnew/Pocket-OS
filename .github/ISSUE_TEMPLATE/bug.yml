name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. scripts/session.sh start
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, device/host, relevant package versions (Phoc, Qt, Quickshell, kernel).
      placeholder: "commit 0fd3a70 · lavender, pmOS edge, kernel 7.2.15 · Fedora 44"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or evidence
      description: "`pocket.shell.diag` lines, session.log excerpts, screenshots, test output."
      render: text
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we know it is fixed (ideally a test).
    validations:
      required: true
