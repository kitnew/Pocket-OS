name: Feature / improvement
description: Missing functionality, technical debt or an investigation
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: The actual problem. Speculative ideas without a concrete problem do not get an issue.
    validations:
      required: true
  - type: textarea
    id: desired
    attributes:
      label: Desired behavior
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: What is in, and explicitly what is out.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies or constraints
      description: Upstream projects, hardware, ADRs, other issues. Name the upstream dependency when the work is blocked.
